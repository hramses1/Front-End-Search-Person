<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Optimización Responsiva -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Meta SEO & Confianza -->
    <title>Portal de Consulta Ciudadana | Verificación y Trámites Oficiales</title>
    <meta name="description" content="Consulta cédula, RUC, licencias, multas y vehículos del Ecuador en un solo lugar. Datos de Registro Civil, SRI, ANT y Función Judicial. Cuenta gratuita, sin tarjeta." />
    <meta name="keywords" content="portal de consulta, identidad ecuador, ruc, matriculación, multas de tránsito, buscar por cédula, datos gubernamentales" />
    <meta name="author" content="Devzio Solutions" />
    <meta name="robots" content="index, follow" />

    <!-- OpenGraph (Redes Sociales/WhatsApp/Google) -->
    <meta property="og:title" content="Portal de Consulta Ciudadana | Devzio Solutions" />
    <meta property="og:description" content="Plataforma segura y rápida para verificación de identidad, estado de RUC, licencias de conducir y multas de tránsito. Consulta en segundos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devzio.site" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="Devzio Solutions" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Portal de Consulta Ciudadana | Devzio Solutions" />
    <meta name="twitter:description" content="Verifica identidad, RUC, licencias y multas de forma segura. Datos oficiales en segundos." />

    <!-- URL Canónica -->
    <link rel="canonical" href="https://devzio.site" />

    <!-- Content Security Policy (Hardened) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws://localhost:* http://localhost:* http://127.0.0.1:*; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!-- Datos Estructurados JSON-LD: ayuda a Google a entender el sitio -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Portal de Consulta Ciudadana",
      "url": "https://devzio.site",
      "description": "Consulta de cédula, RUC, licencias, multas y vehículos del Ecuador a partir de registros públicos.",
      "applicationCategory": "GovernmentService",
      "operatingSystem": "Web",
      "inLanguage": "es-EC",
      "author": {
        "@type": "Organization",
        "name": "Devzio",
        "url": "https://devzio.site"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Preguntas frecuentes: coinciden literalmente con las visibles en la portada -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "inLanguage": "es-EC",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Cómo consulto una cédula?",
          "acceptedAnswer": { "@type": "Answer", "text": "Creas una cuenta, entras al panel y escribes los diez dígitos en la sección de identidad. La respuesta llega en segundos, con los datos tal como los devuelve la fuente oficial." }
        },
        {
          "@type": "Question",
          "name": "¿Puedo buscar por nombres y apellidos?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sí. La sección de búsqueda por nombre acepta nombres y apellidos y devuelve las coincidencias. Cuantos más datos aportes, menos resultados ambiguos obtendrás." }
        },
        {
          "@type": "Question",
          "name": "¿Qué datos devuelve la consulta de cédula?",
          "acceptedAnswer": { "@type": "Answer", "text": "Nombres y apellidos completos, fecha de nacimiento, edad, género, nacionalidad, estado civil y lugar de nacimiento, cuando la fuente los publica." }
        },
        {
          "@type": "Question",
          "name": "¿Hace falta registrarse?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sí. Todas las consultas requieren una cuenta, porque cada una se descuenta de una cuota diaria asociada a tu usuario. El registro es gratuito y no pide tarjeta." }
        },
        {
          "@type": "Question",
          "name": "¿Cuántas consultas incluye la cuenta gratuita?",
          "acceptedAnswer": { "@type": "Answer", "text": "La cuota depende de tu plan y se ve siempre en la cabecera del panel, junto al tiempo que falta para que se renueve. La ventana es de veinticuatro horas y arranca con tu primera consulta." }
        },
        {
          "@type": "Question",
          "name": "¿De dónde salen los datos y es legal consultarlos?",
          "acceptedAnswer": { "@type": "Answer", "text": "De registros públicos del Estado ecuatoriano: Registro Civil, SRI, ANT y Función Judicial. Son consultas que cualquier persona puede hacer en los portales oficiales; aquí se agrupan en un solo sitio para ahorrarte el recorrido. El uso que des a la información obtenida es responsabilidad tuya." }
        }
      ]
    }
    </script>
  </body>
</html>
